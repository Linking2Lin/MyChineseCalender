# 全项目构建属性；本机 SDK 路径仍由未提交的 local.properties 或环境配置提供。
# Gradle 守护进程最大堆为 2 GiB，源码与诊断输出统一使用 UTF-8。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 并行构建选项当前保留为停用示例，不在本文件中额外启用。
# org.gradle.parallel=true
# 使用 AndroidX 支持库命名空间。
android.useAndroidX=true
# Kotlin 源码采用官方格式约定；这是格式配置，不改变运行行为。
kotlin.code.style=official
# 各库的 R 类只暴露自身资源；跨模块引用资源时使用资源所属模块的 R。
android.nonTransitiveRClass=true

# 构建 JVM 的 HTTPS 协议设置，与 Android 应用内 Ktor 客户端配置相互独立。
systemProp.https.protocols=TLSv1.2,TLSv1.3
